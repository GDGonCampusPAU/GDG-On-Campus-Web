# Nginx reverse proxy configuration for GDG On Campus production deployment
upstream backend_api {
    server backend:5000;
}

# 1. Hackathon Showcase Site & General API Reverse Proxy (Port 80)
server {
    listen 80;
    server_name localhost _;

    # Maximum client payload size (for CV / form file uploads)
    client_max_body_size 25M;

    # Gzip compression for static performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend API proxy
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API health check endpoints
    location /health {
        proxy_pass http://backend_api;
    }

    location /ready {
        proxy_pass http://backend_api;
    }

    # Uploads (public & private routing handled by backend)
    location /uploads/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets with caching
    location ~* \.(?:css|js|woff2?|ttf|svg|ico|png|jpe?g|webp)$ {
        root /usr/share/nginx/html/hackaton;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header inside a location drops server-level headers; repeat them here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA fallback for hackathon showcase site
    location / {
        root /usr/share/nginx/html/hackaton;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# 2. Core Team Management Panel (Port 8080)
server {
    listen 8080;
    server_name localhost _;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend API proxy
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://backend_api;
    }

    location /ready {
        proxy_pass http://backend_api;
    }

    location /uploads/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:css|js|woff2?|ttf|svg|ico|png|jpe?g|webp)$ {
        root /usr/share/nginx/html/panel;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header inside a location drops server-level headers; repeat them here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA fallback for panel
    location / {
        root /usr/share/nginx/html/panel;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
