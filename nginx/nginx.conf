# Nginx reverse proxy configuration for GDG On Campus production deployment
# TLS: Cloudflare Origin Certificate (covers apex + *.gdgocpamukkale.com), mounted from ./nginx/certs.
ssl_certificate /etc/nginx/certs/origin.pem;
ssl_certificate_key /etc/nginx/certs/origin.key;
ssl_protocols TLSv1.2 TLSv1.3;

# Behind Cloudflare: restore the visitor IP so the API rate limiter does not see every visitor as one Cloudflare IP.
# Source: https://www.cloudflare.com/ips/ (fetched 2026-11-13)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

upstream backend_api {
    server backend:5000;
}

# 1. Hackathon Showcase Site & General API Reverse Proxy (Port 80, 443 default)
server {
    listen 80;
    listen 443 ssl default_server;
    http2 on;
    server_name gdgocpamukkale.com www.gdgocpamukkale.com localhost _;

    # Maximum client payload size (for CV / form file uploads)
    client_max_body_size 25M;

    # Gzip compression for static performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend API proxy
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API health check endpoints
    location /health {
        proxy_pass http://backend_api;
    }

    location /ready {
        proxy_pass http://backend_api;
    }

    # Uploads (public & private routing handled by backend)
    location /uploads/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Not content-hashed and regenerated when event content changes (npm run og-image), so no year-long immutable cache.
    location = /og-image.png {
        root /usr/share/nginx/html/hackaton;
        expires 1h;
    }

    # Static assets with caching
    location ~* \.(?:css|js|woff2?|ttf|svg|ico|png|jpe?g|webp)$ {
        root /usr/share/nginx/html/hackaton;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header inside a location drops server-level headers; repeat them here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Maintenance mode: the admin panel writes this flag through the backend (shared volume).
    # Every page gets the self-contained maintenance page with 503, even while the backend is down.
    error_page 503 @maintenance;
    location @maintenance {
        root /usr/share/nginx/html/hackaton;
        rewrite ^ /maintenance.html break;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "120" always;
        add_header X-Robots-Tag "noindex" always;
    }

    # SPA fallback for hackathon showcase site
    location / {
        if (-f /etc/nginx/maintenance/active.json) {
            return 503;
        }
        root /usr/share/nginx/html/hackaton;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# 2. Core Team Management Panel (Port 8080, 443 by host name)
server {
    listen 8080;
    listen 443 ssl;
    http2 on;
    server_name panel.gdgocpamukkale.com;

    # Internal tool: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend API proxy
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://backend_api;
    }

    location /ready {
        proxy_pass http://backend_api;
    }

    location /uploads/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:css|js|woff2?|ttf|svg|ico|png|jpe?g|webp)$ {
        root /usr/share/nginx/html/panel;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header inside a location drops server-level headers; repeat them here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA fallback for panel
    location / {
        root /usr/share/nginx/html/panel;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
