# Nginx config for GDG On Campus production deployment.
# TLS is terminated by Nginx Proxy Manager (NPM), which reaches this container over a shared
# Docker network: NPM -> web:80 (gdgocpamukkale.com) and NPM -> web:8080 (panel.gdgocpamukkale.com).
# This container speaks plain HTTP and publishes no public ports.

# Real visitor IP: walk X-Forwarded-For from the right, skipping trusted hops only
# (NPM on the private Docker network, then Cloudflare edges). A spoofed X-Forwarded-For from a
# client that bypasses Cloudflare stops at its own untrusted address, so it cannot fake an IP.
# Cloudflare ranges: https://www.cloudflare.com/ips/ (fetched 2026-11-13)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# NPM sets X-Forwarded-Proto to https; keep it for the backend (fall back to this hop's scheme).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Jury links (/juri/<token>) carry a secret in the URL: keep it out of our logs and Referer headers.
# Only a token-shaped segment (24+ base64url characters) right after /juri/ is replaced. Dots, slashes,
# percent signs and everything after the token stay readable, so a request cannot hide behind the mask.
# Limits: Cloudflare and Nginx Proxy Manager write their own logs, and nginx's error log still prints
# the raw request line when a request fails.
map $request $jury_safe_request {
    default                                                      $request;
    "~*^(?<jury_head>[A-Z]+ /+juri/(?:/|%20)*)[A-Za-z0-9_-]{24,}(?<jury_tail>.*)$"    "$jury_head[hidden]$jury_tail";
}
map $http_referer $jury_safe_referer {
    default                                                      $http_referer;
    "~*^(?<jury_referer_head>https?://[^/]+/+juri/(?:/|%20)*)[A-Za-z0-9_-]{24,}(?<jury_referer_tail>.*)$"    "$jury_referer_head[hidden]$jury_referer_tail";
}
# $request_uri stays the original address across the internal redirects to index.html / maintenance.
map $request_uri $site_referrer_policy {
    default        "strict-origin-when-cross-origin";
    "~*^/+juri/"   "no-referrer";
}
map $request_uri $site_robots_tag {
    default        "";
    "~*^/+juri/"   "noindex, nofollow";
}
# Same fields as the image's "main" format, with the two masked values.
log_format site_masked '$remote_addr - $remote_user [$time_local] "$jury_safe_request" '
                       '$status $body_bytes_sent "$jury_safe_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';

upstream backend_api {
    server backend:5000;
}

# 1. Hackathon Showcase Site & General API Reverse Proxy (Port 80)
server {
    listen 80 default_server;
    server_name gdgocpamukkale.com www.gdgocpamukkale.com localhost _;

    # Replaces the http-level log of the image for this server.
    access_log /var/log/nginx/access.log site_masked;

    # Maximum client payload size (for CV / form file uploads)
    client_max_body_size 25M;

    # Gzip compression for static performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy $site_referrer_policy always;
    # Empty (not sent) except on jury links.
    add_header X-Robots-Tag $site_robots_tag always;

    # Backend API proxy
    location ^~ /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # The backend logs Referer too (morgan "combined").
        proxy_set_header Referer $jury_safe_referer;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API health check endpoints
    location /health {
        proxy_pass http://backend_api;
        proxy_set_header Referer $jury_safe_referer;
    }

    location /ready {
        proxy_pass http://backend_api;
        proxy_set_header Referer $jury_safe_referer;
    }

    # Uploads (public & private routing handled by backend)
    location ^~ /uploads/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Referer $jury_safe_referer;
    }

    # Not content-hashed and regenerated when event content changes (npm run og-image), so no year-long immutable cache.
    location = /og-image.png {
        root /usr/share/nginx/html/hackaton;
        expires 1h;
    }

    # Static assets with caching
    location ~* \.(?:css|js|woff2?|ttf|svg|ico|png|jpe?g|webp)$ {
        root /usr/share/nginx/html/hackaton;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header inside a location drops server-level headers; repeat them here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Maintenance mode: the admin panel writes this flag through the backend (shared volume).
    # Every page gets the self-contained maintenance page with 503, even while the backend is down.
    error_page 503 @maintenance;
    location @maintenance {
        root /usr/share/nginx/html/hackaton;
        rewrite ^ /maintenance.html break;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "120" always;
        add_header X-Robots-Tag "noindex" always;
        add_header Referrer-Policy $site_referrer_policy always;
    }

    # SPA fallback for hackathon showcase site
    location / {
        if (-f /etc/nginx/maintenance/active.json) {
            return 503;
        }
        root /usr/share/nginx/html/hackaton;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# 2. Core Team Management Panel (Port 8080)
server {
    listen 8080;
    server_name panel.gdgocpamukkale.com;

    # Internal tool: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend API proxy
    location ^~ /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://backend_api;
    }

    location /ready {
        proxy_pass http://backend_api;
    }

    location ^~ /uploads/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location ~* \.(?:css|js|woff2?|ttf|svg|ico|png|jpe?g|webp)$ {
        root /usr/share/nginx/html/panel;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header inside a location drops server-level headers; repeat them here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA fallback for panel
    location / {
        root /usr/share/nginx/html/panel;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
