# ==============================================================================
# Production HTTPS virtual hosts (gdgocpamukkale.com + panel.gdgocpamukkale.com)
# ==============================================================================
# Enabled automatically by nginx/enable-https.sh ONLY when the certificate exists:
#   /etc/nginx/certs/origin.pem  +  /etc/nginx/certs/origin.key
# (compose.prod.yaml mounts ./nginx/certs there). Recommended: a Cloudflare Origin
# Certificate covering gdgocpamukkale.com and *.gdgocpamukkale.com, SSL mode "Full (strict)".
#
# Client IP: only Cloudflare edges may set CF-Connecting-IP; nginx then forwards a
# single, clean X-Forwarded-For, so the API keeps TRUST_PROXY_HOPS=1.
# Ranges: https://www.cloudflare.com/ips (refresh occasionally).

# --- Redirect plain HTTP for the production hostnames to HTTPS ---
server {
    listen 80;
    server_name gdgocpamukkale.com www.gdgocpamukkale.com panel.gdgocpamukkale.com;
    return 301 https://$host$request_uri;
}

# --- Hackathon showcase site + public API ---
server {
    listen 443 ssl;
    http2 on;
    server_name gdgocpamukkale.com www.gdgocpamukkale.com;
    include /etc/nginx/https-common.conf;

    location ~* \.(?:css|js|woff2?|ttf|svg|ico|png|jpe?g|webp)$ {
        root /usr/share/nginx/html/hackaton;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/https-headers.conf;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html/hackaton;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# --- Core Team panel (never indexed) ---
server {
    listen 443 ssl;
    http2 on;
    server_name panel.gdgocpamukkale.com;
    include /etc/nginx/https-common.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~* \.(?:css|js|woff2?|ttf|svg|ico|png|jpe?g|webp)$ {
        root /usr/share/nginx/html/panel;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/https-headers.conf;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html/panel;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
